# =====================================================================================
# Runs the WHOLE stack with one command:   docker compose up --build
# Then open http://localhost:8094
#   admin@example.com / password123   (admin)
#   user@example.com  / password123   (regular user)
#
# Three containers on a private Docker network:
#   db        PostgreSQL 16 (data kept in a named volume)
#   backend   Spring Boot API, "prod" profile, NOT exposed to the host
#   frontend  nginx serving Angular and proxying /api -> backend:8080
# =====================================================================================
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: roombooking          # database created on first start
      POSTGRES_USER: roombooking
      POSTGRES_PASSWORD: roombooking    # demo only - use secrets for real deployments
    volumes:
      - db-data:/var/lib/postgresql/data   # keeps the data between restarts
    healthcheck:
      # "Is Postgres ready to accept connections?" - used by depends_on below.
      test: ["CMD-SHELL", "pg_isready -U roombooking -d roombooking"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend                    # uses backend/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: prod      # loads application-prod.yml on top of application.yml
      # "db" is the service name above; Docker's internal DNS resolves it.
      DB_URL: jdbc:postgresql://db:5432/roombooking
      DB_USERNAME: roombooking
      DB_PASSWORD: roombooking
      # Override with:  JWT_SECRET=$(openssl rand -base64 48) docker compose up --build
      JWT_SECRET: ${JWT_SECRET:-Y2hhbmdlLW1lLXRoaXMtaXMtYS1yb29tLWJvb2tpbmctZG9ja2VyLXNlY3JldC0xMjM0NTY3ODkw}
      CORS_ALLOWED_ORIGINS: http://localhost:8094
      # Office time zone: "now" for "no bookings in the past" is evaluated in this zone.
      TZ: ${TZ:-UTC}
    depends_on:
      db:
        condition: service_healthy      # wait until Postgres really accepts connections

  frontend:
    build: ./frontend                   # uses frontend/Dockerfile (Angular build + nginx)
    ports:
      - "8094:80"                       # host port 8094 -> nginx port 80 in the container
    depends_on:
      - backend

volumes:
  db-data:                              # named volume managed by Docker
