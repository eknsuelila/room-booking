# =====================================================================================
# nginx configuration used INSIDE the frontend Docker image (see Dockerfile, stage 2).
#
# nginx does two jobs:
#   1. serves the compiled Angular files (index.html, *.js, *.css) as static files;
#   2. acts as a reverse proxy: requests to /api/... are forwarded to the Spring Boot
#      container. The browser therefore talks to ONE origin (this nginx) for both the
#      app and the API, so no CORS is involved - the same trick proxy.conf.json plays
#      in development.
# =====================================================================================
server {
    # Port inside the container; docker-compose maps host port 8094 -> 80.
    listen 80;

    # Where the Dockerfile copied the Angular build output.
    root /usr/share/nginx/html;
    index index.html;

    # Compress text responses (JS/CSS/JSON) to speed up page loads.
    gzip on;
    gzip_types text/css application/javascript application/json;

    # Forward REST API and Swagger docs to the backend service. "backend" is the service name in
    # docker-compose.yml; Docker's internal DNS resolves it to the backend container's IP.
    location ~ ^/(api|swagger-ui|v3/api-docs) {
        proxy_pass http://backend:8080;
        # Pass the original host and client IP on, so backend logs/CORS see the real values.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA fallback: paths like /rooms/3 are Angular routes, not files on disk. If no file
    # matches, return index.html and let the Angular router render the right page.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
