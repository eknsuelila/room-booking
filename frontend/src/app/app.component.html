<!-- The navbar only exists while someone is logged in. auth.isLoggedIn() is a signal, so this
     block appears/disappears by itself on login/logout. -->
@if (auth.isLoggedIn()) {
  <header class="navbar">
    <a class="brand" routerLink="/rooms">
      <span class="brand-mark">RB</span> Room Booking
    </a>
    <nav aria-label="Main">
      <!-- routerLinkActive adds the "active" CSS class while the URL matches the link -->
      <a routerLink="/rooms" routerLinkActive="active">Rooms</a>
      <a routerLink="/find" routerLinkActive="active">Find a room</a>
      <a routerLink="/my-bookings" routerLinkActive="active">My bookings</a>

      <!-- Role-aware: admin links are only rendered for admins. (The server enforces it anyway.) -->
      @if (auth.isAdmin()) {
        <span class="divider" aria-hidden="true"></span>
        <a routerLink="/admin/dashboard" routerLinkActive="active">Dashboard</a>
        <a routerLink="/admin/rooms" routerLinkActive="active">Manage rooms</a>
        <a routerLink="/admin/bookings" routerLinkActive="active">All bookings</a>
      }
    </nav>
    <div class="user">
      @if (auth.currentUser(); as user) {
        <span class="user-name">{{ user.name }}</span>
        <span class="badge badge-{{ user.role }}">{{ user.role === 'ADMIN' ? 'Admin' : 'User' }}</span>
      }
      <button class="btn btn-ghost" type="button" (click)="auth.logout()">Log out</button>
    </div>
  </header>
}

<main class="container">
  <router-outlet />
</main>
